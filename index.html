<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fffefa" />
  <meta name="description" content="推开蝴蝶门，和 Nono、Dudu 一起进入音乐幻想世界。" />
  <title>蝴蝶门 · Butterfly Door</title>
  <link rel="preload" href="./assets/start-screen.png" as="image" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="opening" id="opening">
    <div class="media-stage" id="mediaStage">
      <img class="opening__poster" id="openingPoster" src="./assets/start-screen.png" alt="Nono 与 Dudu 在蝴蝶门旁等待，画面上方有 START 气泡" />
      <video
        class="opening__idle"
        id="idleVideo"
        preload="auto"
        playsinline
        muted
        loop
        aria-label="Nono、Dudu 与蝴蝶在门边轻轻活动"
      >
        <source src="./assets/butterfly-door-idle.mp4" type="video/mp4" />
      </video>
      <video
        class="opening__video"
        id="openingVideo"
        preload="auto"
        playsinline
        muted
        aria-label="Nono 和 Dudu 推开蝴蝶门并进入草地世界的动画"
      >
        <source src="./assets/butterfly-door-opening.mp4" type="video/mp4" />
      </video>
      <video
        class="opening__finale"
        id="finaleVideo"
        preload="auto"
        playsinline
        muted
        aria-label="Nono 在草地上迎接蝴蝶，最后将蝴蝶捧在手心的动画"
      >
        <source src="./assets/butterfly-in-hand.mp4" type="video/mp4" />
      </video>
      <div class="transition-veil" aria-hidden="true"></div>
      <button class="start-hotspot" id="startButton" type="button" aria-label="点击 START 气泡，推开蝴蝶门">
        <span class="sr-only">点击 START 气泡，推开蝴蝶门</span>
      </button>
      <button class="butterfly-hotspot" id="butterflyButton" type="button" aria-label="点击手心中的蝴蝶，进入门后的世界" hidden>
        <span class="butterfly-hotspot__ring" aria-hidden="true"></span>
        <span class="sr-only">点击手心中的蝴蝶，进入门后的世界</span>
      </button>
    </div>

    <header class="topbar">
      <a class="brand" href="#opening" aria-label="蝴蝶门首页">
        <span class="brand__butterfly" aria-hidden="true">✦</span>
        <span>BUTTERFLY DOOR</span>
      </a>
      <div class="topbar__actions">
        <button class="icon-button" id="soundButton" type="button" aria-pressed="false" aria-label="开启声音">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 9v6h4l5 4V5L9 9H5Z"/><path class="sound-wave" d="M17 9.2a4 4 0 0 1 0 5.6M19.8 6.5a7.8 7.8 0 0 1 0 11"/></svg>
          <span class="icon-button__label">声音</span>
        </button>
        <button class="text-button" id="motionButton" type="button" aria-pressed="false"><span class="desktop-label">减少动态</span><span class="mobile-label" aria-hidden="true">静</span></button>
        <button class="text-button" id="skipButton" type="button"><span class="desktop-label">跳过动画</span><span class="mobile-label" aria-hidden="true">跳</span></button>
      </div>
    </header>

    <div class="progress" id="progress" aria-hidden="true" hidden><span id="progressBar"></span></div>

    <div class="butterfly-reveal" id="butterflyReveal" hidden>
      <svg class="butterfly-reveal__shape" viewBox="0 0 1600 1100" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="butterflyFill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffd95a" />
            <stop offset="0.5" stop-color="#f5df35" />
            <stop offset="1" stop-color="#d7f000" />
          </linearGradient>
        </defs>
        <path fill="url(#butterflyFill)" d="M800 184C595 38 382-20 184 8C108 19 44 43 0 74V558C56 637 132 700 225 744C128 802 72 890 72 990C72 1034 81 1071 99 1100H1501C1519 1071 1528 1034 1528 990C1528 890 1472 802 1375 744C1468 700 1544 637 1600 558V74C1556 43 1492 19 1416 8C1218-20 1005 38 800 184Z" />
      </svg>
      <section class="butterfly-page" id="butterflyPage" aria-labelledby="worldTitle" tabindex="-1">
        <div class="butterfly-page__content">
          <div class="page-sheet page-sheet--outer">
            <div class="page-sheet page-sheet--inner">
            <nav class="butterfly-page__nav" aria-label="门后世界导航">
              <strong>BUTTERFLY DOOR</strong>
              <span>WORLD</span><span>CHARACTERS</span><span>MUSIC</span>
            </nav>
            <header class="butterfly-page__hero">
              <p class="eyebrow">WELCOME TO THE OTHER SIDE</p>
              <h2 id="worldTitle">门后的世界</h2>
              <p>现实里的旋律散落成碎片，跟随蝴蝶继续探索 Nono 与 Dudu 的音乐幻想世界。</p>
            </header>
            </div>
            <div class="butterfly-page__feature" aria-label="世界故事内容预留区">
              <span>01</span><strong>WORLD STORY</strong>
            </div>
            <div class="butterfly-page__grid" aria-label="后续内容预留区">
              <article><span>02</span><h3>CHARACTERS</h3><p>角色内容将在这里展开。</p></article>
              <article><span>03</span><h3>MUSIC</h3><p>音乐内容将在这里展开。</p></article>
              <article><span>04</span><h3>STORIES</h3><p>故事内容将在这里展开。</p></article>
            </div>
            <button class="secondary-button" id="replayButton" type="button">再次观看序章</button>
          </div>
        </div>
      </section>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="./app.js?v=20260927-opening" defer></script>
</body>
</html>
